services:
  mongodb:
    image: mongo:8
    container_name: docmind-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant
    container_name: docmind-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama
    container_name: docmind-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: .
      dockerfile: src/Kastle.DocMind.Api/Dockerfile
    container_name: docmind-api
    ports:
      - "5144:8080"
    depends_on:
      - mongodb
      - qdrant
      - ollama
    environment:
      ASPNETCORE_URLS: http://+:8080
      Ollama__BaseUrl: http://ollama:11434
      Ollama__EmbeddingModel: nomic-embed-text
      Qdrant__Host: qdrant
      Qdrant__Port: 6334
      MongoDbSettings__ConnectionString: mongodb://mongodb:27017
    volumes:
      - storage_data:/app/Storage

volumes:
  mongo_data:
  qdrant_data:
  ollama_data:
  storage_data: